# installer.conf — defaults for debian-asahi-installer.sh
# Uses ":=" so anything you pass on the one-liner as an ENV VAR wins over the
# file, e.g.:
#   curl -fsSL .../bootstrap.sh | BANANAS_KEY_URL=... DISK=/dev/nvme0n1 sh
#
# The Asahi-patched kernel is REQUIRED (stock Debian kernels do not boot Apple
# Silicon). Fill the BANANAS_* block from:
#   https://wiki.debian.org/InstallingDebianOn/Apple/M1

# ---- target (blank = auto-detect the internal NVMe) ----
: "${DISK:=}"                 # e.g. /dev/nvme0n1

# ---- Debian ----
: "${SUITE:=trixie}"
: "${MIRROR:=http://deb.debian.org/debian}"
: "${HOSTNAME_NEW:=debian-asahi}"
: "${USERNAME:=}"             # blank = ask
: "${TIMEZONE:=UTC}"
: "${LOCALE:=en_US.UTF-8}"

# ---- encryption / volumes ----
: "${VG:=debvg}"
: "${SWAP_SIZE:=16G}"
# Passphrase + user password are ALWAYS prompted (never put in this file).

# ---- Asahi kernel source (Debian "Bananas" archive) — REQUIRED ----
# Verified against https://bananas-archive.debian.net/bananas-archive (Jun 2026).
# Suite tracks your release: ${SUITE}-bananas (e.g. trixie-bananas).
: "${BANANAS_APT_LINE:=deb [signed-by=/usr/share/keyrings/bananas.gpg] https://bananas-archive.debian.net/bananas-archive ${SUITE}-bananas main}"
: "${BANANAS_KEY_URL:=https://bananas-archive.debian.net/bananas-archive/bananas-archive-keyring.asc}"
: "${ASAHI_KERNEL_PKG:=linux-image-asahi}"   # pulls linux-image-6.17.x-asahi
: "${ASAHI_FW_PKGS:=}"        # no separate fw pkg; vendor firmware comes from the ESP via the kernel hook

# ---- behaviour ----
: "${ASSUME_YES:=0}"          # 1 = skip the final ERASE confirmation (unattended)

export DISK SUITE MIRROR HOSTNAME_NEW USERNAME TIMEZONE LOCALE VG SWAP_SIZE
export BANANAS_APT_LINE BANANAS_KEY_URL ASAHI_KERNEL_PKG ASAHI_FW_PKGS ASSUME_YES
